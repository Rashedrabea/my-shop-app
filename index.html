<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>نظام راشد V21 - Cloud ERP</title>
    <!-- ربط التصميم -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- مكتبة الرسوم البيانية -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- السحابة (Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- ===== شاشة الدخول وإنشاء الحساب ===== -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h2><i class="fas fa-crown"></i> راشد V21</h2>
            <p class="auth-sub">نظام محاسبي سحابي متكامل</p>
            
            <div id="loginForm">
                <input type="text" id="loginUser" placeholder="اسم المستخدم" value="admin">
                <input type="password" id="loginPass" placeholder="كلمة المرور" value="123456">
                <button class="btn-auth" onclick="handleLogin()">دخول</button>
                <button class="btn-auth btn-green" onclick="toggleAuthMode()">إنشاء حساب جديد</button>
            </div>
            
            <div id="registerForm" style="display:none;">
                <input type="text" id="regUser" placeholder="اسم المستخدم الجديد">
                <input type="password" id="regPass" placeholder="كلمة المرور">
                <input type="password" id="regPassConfirm" placeholder="تأكيد كلمة المرور">
                <button class="btn-auth btn-green" onclick="handleRegister()">إنشاء الحساب</button>
                <button class="btn-auth btn-back" onclick="toggleAuthMode()">عودة للدخول</button>
            </div>
        </div>
    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="appContainer" style="display:none;">
        
        <div class="top-bar">
            <div class="brand">راشد V21</div>
            <div class="user-info">👤 <span id="userDisplay">admin</span></div>
        </div>

        <!-- لوحة المربعات -->
        <div class="dashboard-grid">
            <div class="dash-card" onclick="openModal('sales')"><i class="fas fa-shopping-cart" style="color:#2E4057;"></i><span>مبيعات</span></div>
            <div class="dash-card" onclick="openModal('purchases')"><i class="fas fa-truck-loading" style="color:#E17055;"></i><span>مشتريات</span></div>
            <div class="dash-card" onclick="openModal('products')"><i class="fas fa-warehouse" style="color:#FDCB6E;"></i><span>المخزون</span></div>
            <div class="dash-card" onclick="openModal('clients')"><i class="fas fa-address-book" style="color:#00B894;"></i><span>جهات الاتصال</span></div>
            <div class="dash-card card-treasury" onclick="openModal('treasury')"><i class="fas fa-coins"></i><span>الخزنة</span></div>
            <div class="dash-card card-reports" onclick="openModal('reports')"><i class="fas fa-chart-pie"></i><span>التقارير</span></div>
        </div>
    </div>

    <!-- ===== النوافذ المنبثقة ===== -->
    <!-- المبيعات -->
    <div class="modal-overlay" id="modal-sales">
        <div class="modal-box">
            <div class="modal-header"><h2><i class="fas fa-shopping-cart"></i> مبيعات</h2><button class="modal-close" onclick="closeModal('sales')">&times;</button></div>
            <div class="form-group"><label>العميل</label><input type="text" id="saleClient" placeholder="اسم العميل"></div>
            <div class="form-group"><label>المنتـج</label><select id="saleProduct"><option>اختر المنتج</option></select></div>
            <div class="form-group"><label>الكمية</label><input type="number" id="saleQty" value="1"></div>
            <div class="form-group"><label>سعر البيع</label><input type="number" id="salePrice"></div>
            <div class="form-group"><label>نوع الدفع</label><select id="saleType"><option value="cash">كاش</option><option value="credit">آجل (دين)</option></select></div>
            <button class="btn-main" onclick="addSale()">تسجيل البيع</button>
        </div>
    </div>

    <!-- المشتريات -->
    <div class="modal-overlay" id="modal-purchases">
        <div class="modal-box">
            <div class="modal-header"><h2><i class="fas fa-truck"></i> مشتريات</h2><button class="modal-close" onclick="closeModal('purchases')">&times;</button></div>
            <div class="form-group"><label>المورد</label><input type="text" id="purchaseSupplier" placeholder="اسم المورد"></div>
            <div class="form-group"><label>المنتـج</label><select id="purchaseProduct"><option>اختر المنتج</option></select></div>
            <div class="form-group"><label>الكمية</label><input type="number" id="purchaseQty" value="1"></div>
            <div class="form-group"><label>سعر الشراء</label><input type="number" id="purchasePrice"></div>
            <button class="btn-main" onclick="addPurchase()">تسجيل الشراء</button>
        </div>
    </div>

    <!-- المخزون -->
    <div class="modal-overlay" id="modal-products">
        <div class="modal-box">
            <div class="modal-header"><h2><i class="fas fa-warehouse"></i> المخزون</h2><button class="modal-close" onclick="closeModal('products')">&times;</button></div>
            <div class="form-group"><label>اسم المنتج</label><input type="text" id="prodName"></div>
            <div class="form-group"><label>الكمية</label><input type="number" id="prodQty"></div>
            <div class="form-group"><label>سعر الشراء</label><input type="number" id="prodBuy"></div>
            <div class="form-group"><label>سعر البيع</label><input type="number" id="prodSell"></div>
            <button class="btn-main" onclick="addProduct()">إضافة منتج</button>
            <div id="productList" style="margin-top:10px;max-height:150px;overflow-y:auto;font-size:13px;"></div>
        </div>
    </div>

    <!-- جهات الاتصال -->
    <div class="modal-overlay" id="modal-clients">
        <div class="modal-box">
            <div class="modal-header"><h2><i class="fas fa-address-book"></i> جهات الاتصال</h2><button class="modal-close" onclick="closeModal('clients')">&times;</button></div>
            <div class="form-group"><label>الاسم</label><input type="text" id="contactName"></div>
            <div class="form-group"><label>النوع</label><select id="contactType"><option value="عميل">عميل</option><option value="مورد">مورد</option><option value="كلاهما">كلاهما</option></select></div>
            <button class="btn-main" onclick="addContact()">إضافة</button>
            <div id="clientList" style="margin-top:10px;max-height:150px;overflow-y:auto;font-size:13px;"></div>
        </div>
    </div>

    <!-- الخزنة -->
    <div class="modal-overlay" id="modal-treasury">
        <div class="modal-box">
            <div class="modal-header"><h2><i class="fas fa-coins"></i> الخزنة</h2><button class="modal-close" onclick="closeModal('treasury')">&times;</button></div>
            <div style="font-size:20px;font-weight:bold;text-align:center;padding:15px;background:#f0f0f0;border-radius:8px;margin-bottom:10px;">
                الرصيد: <span id="treasuryDisplay">0</span> ج.م
            </div>
            <div style="display:flex;gap:10px;">
                <input type="number" id="treasuryAmount" placeholder="المبلغ" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;">
                <button onclick="addToTreasury()" class="btn-small-green">إيداع</button>
                <button onclick="withdrawTreasury()" class="btn-small-red">سحب</button>
            </div>
            <div id="treasuryLog" style="margin-top:10px;max-height:120px;overflow-y:auto;font-size:12px;border-top:1px solid #eee;padding-top:10px;"></div>
        </div>
    </div>

    <!-- التقارير -->
    <div class="modal-overlay" id="modal-reports">
        <div class="modal-box">
            <div class="modal-header"><h2><i class="fas fa-chart-pie"></i> التقارير</h2><button class="modal-close" onclick="closeModal('reports')">&times;</button></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
                <button onclick="showReport('income')" class="btn-main" style="background:#00B894;">قائمة الدخل</button>
                <button onclick="showReport('balance')" class="btn-main" style="background:#2E4057;">الميزانية</button>
            </div>
            <div class="report-box" id="reportContent">اختر تقريراً للعرض</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <!-- ربط الملف البرمجي -->
    <script src="script.js"></script>
</body>
</html>
